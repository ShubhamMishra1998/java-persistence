services:
  postgres:
    image: postgres:17
    container_name: jpa-postgres
    environment:
      POSTGRES_DB: jpa_persistence_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - jpa-postgres-data:/var/lib/postgresql/data

volumes:
  jpa-postgres-data: